# Render Blueprint: sobe a API do adapter do TMS como container Docker.
# Segredos (sync: false) são pedidos uma única vez na criação do Blueprint e nunca ficam no repositório.
services:
  - type: web
    name: tms-adapter
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # use "free" para teste (hiberna após inatividade; atrasa a 1ª chamada)
    region: ohio             # próximo de Chicago (cliente); troque se preferir
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: TMS_HOST
        sync: false
      - key: TMS_PORT
        sync: false
      - key: TMS_TOKEN     # também é o Bearer exigido nas chamadas à API
        sync: false
      - key: HOST
        value: 0.0.0.0
